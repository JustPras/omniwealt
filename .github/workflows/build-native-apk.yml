name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build True Native APK (Hermes + New Arch)
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-amd64

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 6. Expo Prebuild Android (Generate True Native Android Project)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: 7. Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 8. Build Standalone Release APK with Embedded JS Bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: 9. Upload Standalone Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniWealth-TrueNative-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
