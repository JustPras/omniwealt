<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniWealth Loading Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0A0A09;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 179.2px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      /**
       * OmniWealth — Perpetual Harmonic Convergence Loading Motion
       * Brand Personality: Sovereign, Perpetual, Precise
       * Timing: 2400ms seamless continuous loop on shared clock
       */

      :root {
        --p2m-duration: 2400ms;
        --p2m-ease-breath: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        --p2m-ease-grav: cubic-bezier(0.4, 0, 0.2, 1);
      }

      #omni-mark {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-omni-gyro 2400ms cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      #nexus-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-nexus-respiration 2400ms cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      #arc-left {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-arc-left-grav 2400ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      #arc-right {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-arc-right-grav 2400ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      #arc-bottom {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-arc-bottom-grav 2400ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* 1. Root Group: Celestial Gyroscopic Hover (Period: 2400ms) */
      @keyframes p2m-omni-gyro {
        0% {
          transform: translateY(0px) rotate(0deg);
          /* token: --p2m-ease-breath */
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        50% {
          transform: translateY(-2.5px) rotate(1.2deg);
          /* token: --p2m-ease-breath */
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        100% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      /* 2. Magnetic Singularity: Central Nexus Respiration & Gold Corona (Period: 2400ms) */
      @keyframes p2m-nexus-respiration {
        0% {
          transform: scale(1.0);
          opacity: 0.88;
          filter: drop-shadow(0 0 0px rgba(212, 175, 55, 0));
          /* token: --p2m-ease-breath */
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        50% {
          transform: scale(1.085);
          opacity: 1.0;
          filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.65));
          /* token: --p2m-ease-breath */
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        100% {
          transform: scale(1.0);
          opacity: 0.88;
          filter: drop-shadow(0 0 0px rgba(212, 175, 55, 0));
        }
      }

      /* 3. Pillar 1: Liquid Cash & Banking Arc (Phase: 0% / 0ms) */
      @keyframes p2m-arc-left-grav {
        0% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        25% {
          transform: translate(3.5px, 0px) scale(0.985);
          opacity: 1.0;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        50% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        75% {
          transform: translate(-1.2px, 0px) scale(1.008);
          opacity: 0.86;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        100% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
        }
      }

      /* 4. Pillar 2: Capital Markets & IDX Equities Arc (Phase: 33.3% / 800ms offset) */
      @keyframes p2m-arc-right-grav {
        0% {
          transform: translate(-0.6px, 0px) scale(1.004);
          opacity: 0.88;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        33.3% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        58.3% {
          transform: translate(-3.5px, 0px) scale(0.985);
          opacity: 1.0;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        83.3% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        100% {
          transform: translate(-0.6px, 0px) scale(1.004);
          opacity: 0.88;
        }
      }

      /* 5. Pillar 3: Web3 & Catalytic Yield Arc (Phase: 66.6% / 1600ms offset) */
      @keyframes p2m-arc-bottom-grav {
        0% {
          transform: translate(0px, -2.2px) scale(0.99);
          opacity: 0.96;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        16.6% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        41.6% {
          transform: translate(0px, 1.2px) scale(1.008);
          opacity: 0.86;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        66.6% {
          transform: translate(0px, 0px) scale(1.0);
          opacity: 0.92;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        91.6% {
          transform: translate(0px, -3.2px) scale(0.985);
          opacity: 1.0;
          /* token: --p2m-ease-grav */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        100% {
          transform: translate(0px, -2.2px) scale(0.99);
          opacity: 0.96;
        }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="2400"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>

    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" width=\"256\" height=\"256\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <defs>\n    <linearGradient id=\"goldGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#F5E6B3\" />\n      <stop offset=\"30%\" stop-color=\"#E8CA65\" />\n      <stop offset=\"70%\" stop-color=\"#D4AF37\" />\n      <stop offset=\"100%\" stop-color=\"#997E20\" />\n    <\/linearGradient>\n    <linearGradient id=\"titaniumGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#FFFFFF\" />\n      <stop offset=\"45%\" stop-color=\"#F5F3EF\" />\n      <stop offset=\"85%\" stop-color=\"#A39E93\" />\n      <stop offset=\"100%\" stop-color=\"#78716C\" />\n    <\/linearGradient>\n  <\/defs>\n\n  <g id=\"omni-mark\">\n    <!-- Pillar 1: Liquid Cash & Banking Arc (Left) in Natural Titanium -->\n    <path id=\"arc-left\" fill=\"url(#titaniumGrad)\" d=\"\n      M 116 22\n      C 58 28 22 72 22 128\n      C 22 158 35 186 56 206\n      L 76 182\n      C 62 167 52 148 52 128\n      C 52 86 78 52 116 48\n      Z\n    \"/>\n\n    <!-- Pillar 2: Capital Markets & IDX Equities Arc (Right) in Natural Titanium -->\n    <path id=\"arc-right\" fill=\"url(#titaniumGrad)\" d=\"\n      M 140 22\n      C 198 28 234 72 234 128\n      C 234 158 221 186 200 206\n      L 180 182\n      C 194 167 204 148 204 128\n      C 204 86 178 52 140 48\n      Z\n    \"/>\n\n    <!-- Pillar 3: Web3 & Growth Catalyst Arc (Bottom Base) in Champagne Gold -->\n    <path id=\"arc-bottom\" fill=\"url(#goldGrad)\" d=\"\n      M 72 216\n      C 88 228 107 236 128 236\n      C 149 236 168 228 184 216\n      L 168 194\n      C 156 202 143 208 128 208\n      C 113 208 100 202 88 194\n      Z\n    \"/>\n\n    <!-- Central Asset Nexus Ring in Radiant Champagne Gold -->\n    <path id=\"nexus-core\" fill=\"url(#goldGrad)\" fill-rule=\"evenodd\" d=\"\n      M 128 98\n      C 144.6 98 158 111.4 158 128\n      C 158 144.6 144.6 158 128 158\n      C 111.4 158 98 144.6 98 128\n      C 98 111.4 111.4 98 128 98 Z\n      M 128 114\n      C 120.3 114 114 120.3 114 128\n      C 114 135.7 120.3 142 128 142\n      C 135.7 142 142 135.7 142 128\n      C 142 120.3 135.7 114 128 114 Z\n    \"/>\n  <\/g>\n<\/svg>";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 2400;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
